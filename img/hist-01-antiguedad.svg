<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid-ant" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CBD5E1" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#F8FAFC"/>
  <rect x="20" y="20" width="760" height="560" fill="url(#grid-ant)" stroke="#334155" stroke-width="2"/>

  <!-- Marco papiro / tabla clásica -->
  <rect x="60" y="65" width="420" height="260" fill="rgba(234,88,12,0.04)" stroke="#0F172A" stroke-width="2.4"/>
  <line x1="320" y1="65" x2="320" y2="325" stroke="#0284C7" stroke-width="1.6"/>
  <line x1="320" y1="225" x2="480" y2="225" stroke="#0284C7" stroke-width="1.6"/>
  <line x1="380" y1="225" x2="380" y2="325" stroke="#0284C7" stroke-width="1.6"/>
  <line x1="320" y1="265" x2="380" y2="265" stroke="#0284C7" stroke-width="1.4"/>

  <!-- Espiral áurea -->
  <path d="M 60 325 A 260 260 0 0 1 320 65 A 160 160 0 0 1 480 225 A 100 100 0 0 1 380 325 A 60 60 0 0 1 320 265 A 40 40 0 0 1 360 225" fill="none" stroke="#EA580C" stroke-width="3"/>

  <!-- Planta de templo clásico modular a la derecha -->
  <rect x="525" y="75" width="215" height="310" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <rect x="565" y="135" width="135" height="190" fill="rgba(2,132,199,0.06)" stroke="#334155" stroke-width="2"/>
  <!-- Columnas perípteras -->
  <g fill="#FFFFFF" stroke="#0F172A" stroke-width="2">
    <circle cx="545" cy="95" r="10"/><circle cx="595" cy="95" r="10"/><circle cx="645" cy="95" r="10"/><circle cx="695" cy="95" r="10"/><circle cx="720" cy="95" r="10"/>
    <circle cx="545" cy="155" r="10"/><circle cx="545" cy="215" r="10"/><circle cx="545" cy="275" r="10"/><circle cx="545" cy="335" r="10"/>
    <circle cx="720" cy="155" r="10"/><circle cx="720" cy="215" r="10"/><circle cx="720" cy="275" r="10"/><circle cx="720" cy="335" r="10"/>
    <circle cx="545" cy="365" r="10"/><circle cx="595" cy="365" r="10"/><circle cx="645" cy="365" r="10"/><circle cx="695" cy="365" r="10"/><circle cx="720" cy="365" r="10"/>
  </g>

  <!-- Regla graduada antigua (Codo real / Gudea) -->
  <g transform="translate(60, 415)">
    <rect x="0" y="0" width="420" height="44" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
    <g stroke="#0284C7" stroke-width="1.5">
      <line x1="30" y1="0" x2="30" y2="20"/><line x1="60" y1="0" x2="60" y2="28"/><line x1="90" y1="0" x2="90" y2="20"/>
      <line x1="120" y1="0" x2="120" y2="28"/><line x1="150" y1="0" x2="150" y2="20"/><line x1="180" y1="0" x2="180" y2="28"/>
      <line x1="210" y1="0" x2="210" y2="20"/><line x1="240" y1="0" x2="240" y2="28"/><line x1="270" y1="0" x2="270" y2="20"/>
      <line x1="300" y1="0" x2="300" y2="28"/><line x1="330" y1="0" x2="330" y2="20"/><line x1="360" y1="0" x2="360" y2="28"/>
      <line x1="390" y1="0" x2="390" y2="20"/>
    </g>
    <text x="16" y="37" font-family="monospace" font-size="12" font-weight="700" fill="#334155">ESCALA MODULAR ANTIGUA // φ = (1 + √5) / 2 ≈ 1.618</text>
  </g>

  <text x="60" y="520" font-family="monospace" font-size="15" font-weight="700" fill="#0F172A">ANTIGÜEDAD (3000 a.C. – IV a.C.) // EGIPTO, MESOPOTAMIA Y GRECIA</text>
  <text x="60" y="544" font-family="monospace" font-size="12" fill="#0284C7">PRIMEROS PLANOS ARQUITECTÓNICOS EN DIORITA Y PAPIRO · ELEMENTOS DE EUCLIDES</text>
</svg>
