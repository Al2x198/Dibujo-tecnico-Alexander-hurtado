<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid-cad" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0284C7" stroke-width="0.6" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#F8FAFC"/>
  <rect x="20" y="20" width="760" height="560" fill="url(#grid-cad)" stroke="#334155" stroke-width="2"/>

  <!-- Ventana CAD principal -->
  <rect x="55" y="55" width="465" height="390" fill="#FFFFFF" stroke="#0F172A" stroke-width="2"/>
  <rect x="55" y="55" width="465" height="30" fill="#0F172A"/>
  <text x="72" y="75" font-family="monospace" font-size="12" fill="#FFFFFF" font-weight="700">VIEWPORT 3D // MODELO PARAMÉTRICO BIM-CAD</text>

  <!-- Malla wireframe 3D isométrica -->
  <g transform="translate(285, 255)">
    <polygon points="0,120 140,40 140,-45 0,35" fill="rgba(2,132,199,0.12)" stroke="#0284C7" stroke-width="2"/>
    <polygon points="0,120 -140,40 -140,-45 0,35" fill="rgba(15,23,42,0.06)" stroke="#0F172A" stroke-width="2"/>
    <polygon points="0,-125 140,-45 0,35 -140,-45" fill="rgba(234,88,12,0.09)" stroke="#0F172A" stroke-width="2"/>
    <!-- Subdivisión paramétrica -->
    <line x1="-70" y1="-85" x2="70" y2="-5" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="5 3"/>
    <line x1="70" y1="-85" x2="-70" y2="-5" stroke="#0284C7" stroke-width="1.2" stroke-dasharray="5 3"/>
    <!-- Nodos de control -->
    <g fill="#EA580C">
      <rect x="-4" y="-129" width="8" height="8"/>
      <rect x="136" y="-49" width="8" height="8"/>
      <rect x="-144" y="-49" width="8" height="8"/>
      <rect x="-4" y="31" width="8" height="8"/>
      <rect x="-4" y="116" width="8" height="8"/>
    </g>
  </g>

  <!-- Panel derecho: Vistas sincronizadas 2D + Norma ISO -->
  <rect x="540" y="55" width="205" height="185" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/>
  <text x="554" y="77" font-family="monospace" font-size="11" font-weight="700" fill="#0284C7">EXTRACCIÓN 2D // ALZADO</text>
  <rect x="572" y="102" width="140" height="105" fill="rgba(2,132,199,0.08)" stroke="#0F172A" stroke-width="2"/>
  <line x1="572" y1="154" x2="712" y2="154" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="8 3"/>

  <rect x="540" y="260" width="205" height="185" fill="#FFFFFF" stroke="#0F172A" stroke-width="1.8"/>
  <text x="554" y="282" font-family="monospace" font-size="11" font-weight="700" fill="#0284C7">ESTÁNDAR // ISO 19650</text>
  <text x="554" y="315" font-family="monospace" font-size="11" fill="#334155">FORMAT: STEP / IFC</text>
  <text x="554" y="340" font-family="monospace" font-size="11" fill="#334155">TOLERANCIA: ±0.01 mm</text>
  <text x="554" y="365" font-family="monospace" font-size="11" fill="#334155">CAPAS: 12 ACTIVAS</text>
  <text x="554" y="395" font-family="monospace" font-size="11" font-weight="700" fill="#EA580C">SINCRONIZACIÓN EN VIVO</text>

  <text x="55" y="510" font-family="monospace" font-size="15" font-weight="700" fill="#0F172A">ERA MODERNA Y DIGITAL (SIGLO XX – ACTUALIDAD) // ISO, CAD Y BIM</text>
  <text x="55" y="534" font-family="monospace" font-size="12" fill="#0284C7">NORMALIZACIÓN GLOBAL ISO 128 · DISEÑO ASISTIDO POR COMPUTADORA Y GEMELOS DIGITALES</text>
</svg>
