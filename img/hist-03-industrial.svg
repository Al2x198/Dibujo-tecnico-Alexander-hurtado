<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid-ind" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CBD5E1" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#F8FAFC"/>
  <rect x="20" y="20" width="760" height="560" fill="url(#grid-ind)" stroke="#334155" stroke-width="2"/>

  <!-- Diedro de Monge a la izquierda -->
  <polygon points="85,75 340,75 340,290 85,290" fill="rgba(2,132,199,0.08)" stroke="#0F172A" stroke-width="2.2"/>
  <polygon points="85,290 340,290 420,410 165,410" fill="rgba(234,88,12,0.07)" stroke="#0F172A" stroke-width="2.2"/>
  <line x1="85" y1="290" x2="340" y2="290" stroke="#0F172A" stroke-width="3.5"/>
  <text x="55" y="295" font-family="monospace" font-size="14" font-weight="700" fill="#0F172A">LT</text>
  <text x="102" y="102" font-family="monospace" font-size="14" font-weight="700" fill="#0284C7">PV (ALZADO)</text>
  <text x="175" y="395" font-family="monospace" font-size="14" font-weight="700" fill="#EA580C">PH (PLANTA)</text>

  <!-- Objeto proyectado y rayos -->
  <circle cx="245" cy="195" r="7" fill="#EA580C"/>
  <line x1="245" y1="195" x2="205" y2="150" stroke="#0284C7" stroke-width="1.8" stroke-dasharray="6 4"/>
  <line x1="245" y1="195" x2="245" y2="350" stroke="#0284C7" stroke-width="1.8" stroke-dasharray="6 4"/>
  <polyline points="205,150 205,290 245,350" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="205" cy="150" r="5" fill="#0284C7"/>
  <circle cx="245" cy="350" r="5" fill="#0284C7"/>

  <!-- Rueda volante / maquinaria industrial siglo XIX a la derecha -->
  <g transform="translate(575, 250)">
    <circle cx="0" cy="0" r="135" fill="rgba(2,132,199,0.04)" stroke="#0F172A" stroke-width="3"/>
    <circle cx="0" cy="0" r="112" fill="none" stroke="#334155" stroke-width="2"/>
    <circle cx="0" cy="0" r="32" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#EA580C" stroke-width="2"/>
    <!-- Radios del volante -->
    <g stroke="#0F172A" stroke-width="6">
      <line x1="0" y1="-32" x2="0" y2="-112"/>
      <line x1="0" y1="32" x2="0" y2="112"/>
      <line x1="-32" y1="0" x2="-112" y2="0"/>
      <line x1="32" y1="0" x2="112" y2="0"/>
    </g>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="12 4 3 4"/>
    <line x1="0" y1="-160" x2="0" y2="160" stroke="#EA580C" stroke-width="1.4" stroke-dasharray="12 4 3 4"/>
  </g>

  <text x="60" y="510" font-family="monospace" font-size="15" font-weight="700" fill="#0F172A">REVOLUCIÓN INDUSTRIAL (1795 – SIGLO XIX) // GASPARD MONGE</text>
  <text x="60" y="534" font-family="monospace" font-size="12" fill="#0284C7">GEOMETRÍA DESCRIPTIVA · SISTEMA DIÉDRICO ORTOGONAL · ESTANDARIZACIÓN DE TALLER</text>
</svg>
