<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid-minor" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#CBD5E1" stroke-width="0.5" opacity="0.45"/>
    </pattern>
    <pattern id="grid-major" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect width="80" height="80" fill="url(#grid-minor)"/>
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#0284C7" stroke-width="0.7" opacity="0.22"/>
    </pattern>
    <pattern id="earth-hatch" width="12" height="12" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#334155" stroke-width="1.2" opacity="0.35"/>
    </pattern>
    <pattern id="concrete-hatch" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="0.9" fill="#334155" opacity="0.5"/>
      <circle cx="10" cy="11" r="1.1" fill="#334155" opacity="0.45"/>
      <polygon points="7,2 9,5 6,5" fill="none" stroke="#334155" stroke-width="0.7" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#F8FAFC"/>
  <rect x="20" y="20" width="760" height="560" fill="url(#grid-major)" stroke="#334155" stroke-width="2"/>
  <rect x="28" y="28" width="744" height="544" fill="none" stroke="#334155" stroke-width="0.8"/>

  <!-- Eje de simetría -->
  <line x1="400" y1="45" x2="400" y2="515" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="14 4 3 4"/>

  <!-- Terreno natural y excavación -->
  <rect x="70" y="430" width="660" height="75" fill="url(#earth-hatch)"/>
  <line x1="70" y1="430" x2="730" y2="430" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Zapatas corridas de hormigón -->
  <rect x="145" y="430" width="105" height="55" fill="url(#concrete-hatch)" stroke="#0F172A" stroke-width="2.4"/>
  <rect x="550" y="430" width="105" height="55" fill="url(#concrete-hatch)" stroke="#0F172A" stroke-width="2.4"/>

  <!-- Solera y forjado sanitario -->
  <rect x="178" y="405" width="444" height="25" fill="rgba(2,132,199,0.12)" stroke="#0F172A" stroke-width="2.2"/>

  <!-- Muros portantes cortados -->
  <rect x="180" y="210" width="34" height="195" fill="#0F172A"/>
  <rect x="586" y="210" width="34" height="195" fill="#0F172A"/>
  <rect x="184" y="214" width="26" height="187" fill="none" stroke="#F8FAFC" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="590" y="214" width="26" height="187" fill="none" stroke="#F8FAFC" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Ventana cortada en muro derecho -->
  <rect x="592" y="265" width="22" height="75" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <line x1="603" y1="265" x2="603" y2="340" stroke="#0284C7" stroke-width="1.5"/>

  <!-- Zuncho de coronación y cercha de cubierta -->
  <rect x="172" y="196" width="456" height="16" fill="#334155"/>
  <polygon points="120,210 400,88 680,210 645,210 400,104 155,210" fill="rgba(234,88,12,0.15)" stroke="#0F172A" stroke-width="2.4" stroke-linejoin="round"/>
  <line x1="265" y1="147" x2="400" y2="196" stroke="#334155" stroke-width="2"/>
  <line x1="535" y1="147" x2="400" y2="196" stroke="#334155" stroke-width="2"/>
  <line x1="400" y1="104" x2="400" y2="196" stroke="#334155" stroke-width="2"/>

  <!-- Cotas altimétricas -->
  <g font-family="monospace" font-size="13" font-weight="700" fill="#0284C7">
    <line x1="78" y1="405" x2="175" y2="405" stroke="#0284C7" stroke-width="1.1" stroke-dasharray="5 3"/>
    <polygon points="105,405 97,392 113,392" fill="#0284C7"/>
    <text x="78" y="384">+0.00 m</text>

    <line x1="78" y1="210" x2="175" y2="210" stroke="#0284C7" stroke-width="1.1" stroke-dasharray="5 3"/>
    <polygon points="105,210 97,197 113,197" fill="#0284C7"/>
    <text x="78" y="189">+2.85 m</text>

    <line x1="400" y1="88" x2="705" y2="88" stroke="#EA580C" stroke-width="1.2" stroke-dasharray="5 3"/>
    <polygon points="680,88 672,75 688,75" fill="#EA580C"/>
    <text x="645" y="68" fill="#EA580C">+4.25 m</text>
  </g>

  <!-- Cajetín técnico -->
  <rect x="460" y="512" width="304" height="52" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
  <line x1="460" y1="536" x2="764" y2="536" stroke="#334155" stroke-width="1"/>
  <line x1="640" y1="536" x2="640" y2="564" stroke="#334155" stroke-width="1"/>
  <text x="472" y="529" font-family="monospace" font-size="12" font-weight="700" fill="#0F172A">SECCIÓN CONSTRUCTIVA A-A' // CUBIERTA</text>
  <text x="472" y="554" font-family="monospace" font-size="11" fill="#0284C7">NORMA: ISO 128-40 / CTE</text>
  <text x="652" y="554" font-family="monospace" font-size="11" font-weight="700" fill="#EA580C">ESC. 1:25</text>
</svg>
