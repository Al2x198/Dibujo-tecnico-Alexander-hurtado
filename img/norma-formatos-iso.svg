<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540">
  <rect width="800" height="540" fill="#F8FAFC"/>
  <!-- Marco exterior A0 proporcional (720 x 508 approx √2) -->
  <rect x="40" y="16" width="720" height="508" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <!-- División A1 (mitad izquierda) -->
  <line x1="400" y1="16" x2="400" y2="524" stroke="#0284C7" stroke-width="2"/>
  <!-- División A2 (cuarto superior derecho) -->
  <line x1="400" y1="270" x2="760" y2="270" stroke="#0284C7" stroke-width="2"/>
  <!-- División A3 (octavo) -->
  <line x1="580" y1="270" x2="580" y2="524" stroke="#EA580C" stroke-width="1.8"/>
  <!-- División A4 -->
  <line x1="580" y1="397" x2="760" y2="397" stroke="#EA580C" stroke-width="1.8"/>

  <g font-family="monospace" font-weight="700" text-anchor="middle">
    <text x="220" y="255" font-size="38" fill="#0F172A">A1</text>
    <text x="220" y="285" font-size="14" fill="#0284C7">594 × 841 mm</text>

    <text x="580" y="135" font-size="32" fill="#0F172A">A2</text>
    <text x="580" y="162" font-size="13" fill="#0284C7">420 × 594 mm</text>

    <text x="490" y="390" font-size="26" fill="#0F172A">A3</text>
    <text x="490" y="414" font-size="12" fill="#EA580C">297 × 420 mm</text>

    <text x="670" y="330" font-size="22" fill="#0F172A">A4</text>
    <text x="670" y="352" font-size="11" fill="#EA580C">210 × 297 mm</text>

    <text x="670" y="462" font-size="18" fill="#334155">A5</text>
    <text x="670" y="482" font-size="11" fill="#334155">148 × 210 mm</text>
  </g>
  <rect x="48" y="24" width="190" height="28" fill="#0F172A"/>
  <text x="58" y="42" font-family="monospace" font-size="11" font-weight="700" fill="#FFFFFF">SERIE A // A0: 841 × 1189 mm</text>
</svg>
