<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid-arq" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CBD5E1" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="#F8FAFC"/>
  <rect x="20" y="20" width="760" height="560" fill="url(#grid-arq)" stroke="#334155" stroke-width="2"/>

  <!-- Alzado arquitectónico principal -->
  <line x1="55" y1="360" x2="745" y2="360" stroke="#0F172A" stroke-width="3"/>
  <rect x="115" y="135" width="440" height="225" fill="rgba(2,132,199,0.05)" stroke="#0F172A" stroke-width="2.5"/>
  <rect x="102" y="122" width="466" height="16" fill="#0F172A"/>
  <rect x="108" y="242" width="454" height="12" fill="#334155"/>
  <!-- Columnas -->
  <line x1="255" y1="138" x2="255" y2="360" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="8 4"/>
  <line x1="405" y1="138" x2="405" y2="360" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="8 4"/>
  <!-- Ventanales planta alta y baja -->
  <rect x="145" y="160" width="85" height="62" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <rect x="285" y="160" width="95" height="62" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <rect x="430" y="160" width="95" height="62" fill="#FFFFFF" stroke="#0284C7" stroke-width="2"/>
  <rect x="285" y="270" width="95" height="90" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.2"/>
  <line x1="332.5" y1="270" x2="332.5" y2="360" stroke="#EA580C" stroke-width="1.5"/>

  <!-- Perspectiva volumétrica auxiliar derecha -->
  <g transform="translate(650, 240)">
    <polygon points="0,70 72,30 72,-55 0,-15" fill="rgba(2,132,199,0.12)" stroke="#0F172A" stroke-width="2"/>
    <polygon points="0,70 -72,30 -72,-55 0,-15" fill="rgba(15,23,42,0.07)" stroke="#0F172A" stroke-width="2"/>
    <polygon points="0,-95 72,-55 0,-15 -72,-55" fill="rgba(234,88,12,0.1)" stroke="#0F172A" stroke-width="2"/>
    <text x="0" y="100" text-anchor="middle" font-family="monospace" font-size="11" font-weight="700" fill="#0284C7">VOLUMETRÍA 3D</text>
  </g>

  <!-- Cotas y rótulo -->
  <line x1="80" y1="122" x2="80" y2="360" stroke="#0284C7" stroke-width="1.5"/>
  <line x1="72" y1="122" x2="88" y2="122" stroke="#0284C7" stroke-width="1.5"/>
  <line x1="72" y1="360" x2="88" y2="360" stroke="#0284C7" stroke-width="1.5"/>
  <text x="64" y="242" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#0284C7" transform="rotate(-90 64 242)">ALTURA TOTAL 6.40 m</text>

  <!-- Escalímetro inferior -->
  <g transform="translate(115, 425)">
    <rect x="0" y="0" width="440" height="32" fill="#FFFFFF" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="88" height="10" fill="#0F172A"/>
    <rect x="176" y="0" width="88" height="10" fill="#0F172A"/>
    <rect x="352" y="0" width="88" height="10" fill="#0F172A"/>
    <text x="0" y="25" font-family="monospace" font-size="11" fill="#334155">0 m          2 m          4 m          6 m          8 m          10 m (ESC. 1:50)</text>
  </g>

  <text x="60" y="515" font-family="monospace" font-size="15" font-weight="700" fill="#0F172A">ARQUITECTURA Y URBANISMO // ISO 7519 &amp; BIM</text>
  <text x="60" y="539" font-family="monospace" font-size="12" fill="#0284C7">PLANTAS ACOTADAS · ALZADOS DE FACHADA · SECCIONES CONSTRUCTIVAS</text>
</svg>
